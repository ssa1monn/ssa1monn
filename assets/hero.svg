  </defs>
  <rect width="900" height="280" rx="22" fill="url(#canvas)"/>
  <rect x="24" y="24" width="510" height="232" rx="20" fill="#10151c"/>
  <rect x="552" y="24" width="146" height="108" rx="20" fill="url(#blue)"/>
  <rect x="716" y="24" width="160" height="108" rx="20" fill="#d9f99d"/>
  <rect x="552" y="150" width="204" height="106" rx="20" fill="#ffffff" stroke="#d0d7de"/>
