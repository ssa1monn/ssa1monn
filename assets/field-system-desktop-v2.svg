    <rect y="164" width="812" height="70" rx="12" fill="var(--soft)"/><text x="18" y="193" fill="var(--pink)" class="mono" font-size="10" font-weight="800">2026 / OCTOBER</text><text x="18" y="216" fill="var(--fg)" font-size="15" font-weight="750">한국게임학회 논문지 10월호</text><rect x="647" y="181" width="147" height="36" rx="18" fill="var(--fg)"/><text x="720" y="204" text-anchor="middle" fill="var(--bg)" class="mono" font-size="10" font-weight="800">KCI 게재 예정</text>
