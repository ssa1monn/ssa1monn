    <rect x="544" width="268" height="190" rx="14" fill="var(--blue)"/><text x="564" y="32" fill="#dfe6ff" class="mono" font-size="10" font-weight="800" letter-spacing="1.5">03 / ACADEMIC</text><text x="564" y="70" fill="#ffffff" font-size="22" font-weight="800">INU · ECL</text><text x="564" y="104" fill="#e7ebff" font-size="13">B.S. Computer Engineering</text><text x="564" y="128" fill="#e7ebff" font-size="13">3rd year undergraduate</text><text x="564" y="152" fill="#e7ebff" font-size="13">Researcher · Teaching Assistant</text><circle cx="778" cy="35" r="7" fill="var(--lime)" class="pulse"/>
