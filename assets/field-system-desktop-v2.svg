<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
  <title id="title">Go Woo Suk Field System Profile</title><desc id="desc">Responsive profile dashboard covering identity, game engineering, research, academic recognition, and technology.</desc>
  <style>
    :root{--bg:#f6f7f2;--panel:#ffffff;--fg:#16181d;--muted:#68707c;--line:#d5d9e0;--soft:#e9ecf1;--blue:#2f5bff;--blue2:#dfe6ff;--lime:#dfff4f;--pink:#ff6fae}
